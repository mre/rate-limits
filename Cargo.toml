[package]
name = "rate-limits"
authors = ["Matthias Endler <matthias@endler.dev>"]
version = "0.6.0"
edition = "2024"
description = "A parser for HTTP rate limit headers"
license = "Apache-2.0/MIT"
homepage = "https://github.com/mre/rate-limits"
repository = "https://github.com/mre/rate-limits"
documentation = "https://docs.rs/rate-limits"
keywords = ["http", "rate-limit", "header", "parser"]

[features]
default = ["http"]

[dependencies]
bitflags = "2.11.1"
displaydoc = "0.2.5"
headers = "0.4"
http = { version = "1.4", optional = true }
once_cell = "1.21.3"
reqwest = { version = "0.12", optional = true, default-features = false }
thiserror = "2.0.18"
time = { version = "0.3.46", features = ["parsing"] }

[dev-dependencies]
doc-comment = "0.3.4"
indoc = "2.0.7"
time = { version = "0.3.46", features = ["parsing", "macros"] }

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
anonymous_parameters = "deny"
macro_use_extern_crate = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "deny"
semicolon_in_expressions_from_macros = "warn"
unreachable_pub = "warn"
unused_extern_crates = "warn"
variant_size_differences = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
module_name_repetitions = "allow"

[lints.rustdoc]
invalid_html_tags = "warn"
