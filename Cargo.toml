[package]
name = "rate-limits"
authors = ["Matthias Endler <matthias@endler.dev>"]
version = "0.6.0"
edition = "2021"
description = "A parser for HTTP rate limit headers"
license = "Apache-2.0/MIT"
homepage = "https://github.com/mre/rate-limits"
repository = "https://github.com/mre/rate-limits"
documentation = "https://docs.rs/rate-limits"
keywords = ["http", "rate-limit", "header", "parser"]

[dependencies]
displaydoc = "0.2.5"
headers = "0.4"
http = "1.4"
once_cell = "1.21.3"
thiserror = "2.0.18"
time = { version = "0.3.46", features = ["parsing", "macros"] }

[dev-dependencies]
doc-comment = "0.3.4"
indoc = "2.0.7"
